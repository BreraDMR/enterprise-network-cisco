! Edge router -- Internet gateway and NAT boundary.
! Models the role the BOM gives the MikroTik hEX S (routing, IPsec,
! firewalling -- see docs/report.md section 3.2). MikroTik uses RouterOS,
! not IOS, so this is the "if it were IOS" equivalent referenced in
! example-code/README.md, not a literal translation of a RouterOS config.
!
hostname EDGE-RTR
!
service password-encryption
no ip domain-lookup
enable secret REPLACE_ME
!
interface GigabitEthernet0/0
 description WAN uplink (ISP)
 ip address dhcp
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description LAN uplink to CORE-SW1
 ip address 10.0.2.2 255.255.255.252
 ip nat inside
 no shutdown
!
router ospf 1
 router-id 10.0.2.2
 network 10.0.2.0 0.0.0.3 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0
!
ip access-list extended NAT-SOURCE
 permit ip 10.0.0.0 0.0.255.255 any
!
ip nat inside source list NAT-SOURCE interface GigabitEthernet0/0 overload
!
! Basic inbound filtering on the WAN side: drop anything not part of an
! established/return flow, allow inbound IPsec for site-to-site VPN
! (the BOM specifically calls out hEX S's hardware IPsec acceleration).
ip access-list extended WAN-IN
 permit udp any any eq isakmp
 permit esp any any
 permit tcp any any established
 deny ip any any log
interface GigabitEthernet0/0
 ip access-group WAN-IN in
!
line vty 0 4
 transport input ssh
 login local
end
