! Floor 3 access layer.
! The original BOM puts two Cisco CBS110-8T-D switches per floor
! ("switch X.1" serving rooms 1-3, "switch X.2" serving rooms 4-6),
! each with only 8 ports. With up to 8 seats *per room* and 3 rooms
! per switch, that's not enough ports (see example-code/README.md,
! "Findings" -- this is one of them). This config models the access
! layer as appropriately-sized per floor instead of literally as two
! 8-port switches, so the VLAN/port-security pattern below is still
! correct to copy onto real, adequately-sized hardware.
!
hostname ACC-SW-F3
!
service password-encryption
no ip domain-lookup
enable secret REPLACE_ME
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
vlan 301
 name F3-ROOM1
vlan 302
 name F3-ROOM2
vlan 303
 name F3-ROOM3
vlan 304
 name F3-ROOM4
vlan 305
 name F3-ROOM5
vlan 306
 name F3-ROOM6
!
interface range GigabitEthernet0/1-6
 description Floor 3 Room 1 workstations (6 seats)
 switchport mode access
 switchport access vlan 301
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/7-14
 description Floor 3 Room 2 workstations (8 seats)
 switchport mode access
 switchport access vlan 302
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/15-18
 description Floor 3 Room 3 workstations (4 seats)
 switchport mode access
 switchport access vlan 303
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/19-25
 description Floor 3 Room 4 workstations (7 seats)
 switchport mode access
 switchport access vlan 304
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/26-28
 description Floor 3 Room 5 workstations (3 seats)
 switchport mode access
 switchport access vlan 305
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/29-35
 description Floor 3 Room 6 workstations (7 seats)
 switchport mode access
 switchport access vlan 306
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/36
 description Uplink trunk to CORE-SW1
 switchport mode trunk
 switchport trunk allowed vlan 301,302,303,304,305,306,1
 switchport trunk native vlan 1
!
interface Vlan1
 ip address 10.0.0.13 255.255.255.240
 no shutdown
ip default-gateway 10.0.0.1
!
line vty 0 4
 transport input ssh
 login local
end
