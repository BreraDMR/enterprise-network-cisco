! Floor 2 access layer.
! The original BOM puts two Cisco CBS110-8T-D switches per floor
! ("switch X.1" serving rooms 1-3, "switch X.2" serving rooms 4-6),
! each with only 8 ports. With up to 8 seats *per room* and 3 rooms
! per switch, that's not enough ports (see example-code/README.md,
! "Findings" -- this is one of them). This config models the access
! layer as appropriately-sized per floor instead of literally as two
! 8-port switches, so the VLAN/port-security pattern below is still
! correct to copy onto real, adequately-sized hardware.
!
hostname ACC-SW-F2
!
service password-encryption
no ip domain-lookup
enable secret REPLACE_ME
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
vlan 201
 name F2-ROOM1
vlan 202
 name F2-ROOM2
vlan 203
 name F2-ROOM3
vlan 204
 name F2-ROOM4
vlan 205
 name F2-ROOM5
vlan 206
 name F2-ROOM6
!
interface range GigabitEthernet0/1-4
 description Floor 2 Room 1 workstations (4 seats)
 switchport mode access
 switchport access vlan 201
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/5-9
 description Floor 2 Room 2 workstations (5 seats)
 switchport mode access
 switchport access vlan 202
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/10-13
 description Floor 2 Room 3 workstations (4 seats)
 switchport mode access
 switchport access vlan 203
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/14-19
 description Floor 2 Room 4 workstations (6 seats)
 switchport mode access
 switchport access vlan 204
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/20-26
 description Floor 2 Room 5 workstations (7 seats)
 switchport mode access
 switchport access vlan 205
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/27-31
 description Floor 2 Room 6 workstations (5 seats)
 switchport mode access
 switchport access vlan 206
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/32
 description Uplink trunk to CORE-SW1
 switchport mode trunk
 switchport trunk allowed vlan 201,202,203,204,205,206,1
 switchport trunk native vlan 1
!
interface Vlan1
 ip address 10.0.0.12 255.255.255.240
 no shutdown
ip default-gateway 10.0.0.1
!
line vty 0 4
 transport input ssh
 login local
end
