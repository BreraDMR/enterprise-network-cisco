! Core / distribution switch -- floor 1, server room (room 3)
! Models: VLAN-per-room L3 core. Real device would need a Catalyst-class
! IOS switch with routing enabled (the BOM's Ubiquiti UniFi Switch 24 is
! GUI/controller-managed, not IOS CLI -- see example-code/README.md).
!
hostname CORE-SW1
!
ip routing
service password-encryption
no ip domain-lookup
enable secret REPLACE_ME
!
vlan 1
 name MGMT
vlan 10
 name SERVERS
vlan 101
 name F1-ROOM1
vlan 102
 name F1-ROOM2
vlan 103
 name F1-ROOM3
vlan 104
 name F1-ROOM4
vlan 105
 name F1-ROOM5
vlan 106
 name F1-ROOM6
vlan 201
 name F2-ROOM1
vlan 202
 name F2-ROOM2
vlan 203
 name F2-ROOM3
vlan 204
 name F2-ROOM4
vlan 205
 name F2-ROOM5
vlan 206
 name F2-ROOM6
vlan 301
 name F3-ROOM1
vlan 302
 name F3-ROOM2
vlan 303
 name F3-ROOM3
vlan 304
 name F3-ROOM4
vlan 305
 name F3-ROOM5
vlan 306
 name F3-ROOM6
!
interface Vlan1
 description Switch/router management
 ip address 10.0.0.1 255.255.255.240
 no shutdown
!
interface Vlan10
 description Servers (HPE ProLiant DL380 Gen10)
 ip address 10.0.1.1 255.255.255.224
 no shutdown
!
interface Vlan101
 description Floor 1 Room 1 (6 seats)
 ip address 10.1.1.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan102
 description Floor 1 Room 2 (8 seats)
 ip address 10.1.2.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan103
 description Floor 1 Room 3 (7 seats)
 ip address 10.1.3.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan104
 description Floor 1 Room 4 (5 seats)
 ip address 10.1.4.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan105
 description Floor 1 Room 5 (6 seats)
 ip address 10.1.5.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan106
 description Floor 1 Room 6 (5 seats)
 ip address 10.1.6.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan201
 description Floor 2 Room 1 (4 seats)
 ip address 10.2.1.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan202
 description Floor 2 Room 2 (5 seats)
 ip address 10.2.2.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan203
 description Floor 2 Room 3 (4 seats)
 ip address 10.2.3.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan204
 description Floor 2 Room 4 (6 seats)
 ip address 10.2.4.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan205
 description Floor 2 Room 5 (7 seats)
 ip address 10.2.5.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan206
 description Floor 2 Room 6 (5 seats)
 ip address 10.2.6.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan301
 description Floor 3 Room 1 (6 seats)
 ip address 10.3.1.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan302
 description Floor 3 Room 2 (8 seats)
 ip address 10.3.2.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan303
 description Floor 3 Room 3 (4 seats)
 ip address 10.3.3.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan304
 description Floor 3 Room 4 (7 seats)
 ip address 10.3.4.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan305
 description Floor 3 Room 5 (3 seats)
 ip address 10.3.5.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
interface Vlan306
 description Floor 3 Room 6 (7 seats)
 ip address 10.3.6.1 255.255.255.224
 ip helper-address 10.0.1.1
 no shutdown
!
! DHCP for room VLANs -- pattern shown for room 101, repeat per VLAN
! using the addresses from example-code/network_plan.py.
ip dhcp excluded-address 10.1.1.1 10.1.1.4
ip dhcp pool F1-ROOM1
 network 10.1.1.0 255.255.255.224
 default-router 10.1.1.1
 dns-server 10.0.1.53
!
! Trunks down to each floor's access-layer switches (see
! cisco-configs/access-floor{1,2,3}.cfg for the other side).
interface range GigabitEthernet1/0/1
 description Trunk to Floor 1 access switches
 switchport mode trunk
 switchport trunk allowed vlan 101,102,103,104,105,106,1
 switchport trunk native vlan 1
!
interface range GigabitEthernet1/0/2
 description Trunk to Floor 2 access switches
 switchport mode trunk
 switchport trunk allowed vlan 201,202,203,204,205,206,1
 switchport trunk native vlan 1
!
interface range GigabitEthernet1/0/3
 description Trunk to Floor 3 access switches
 switchport mode trunk
 switchport trunk allowed vlan 301,302,303,304,305,306,1
 switchport trunk native vlan 1
!
! Uplink to the edge router for Internet / inter-site traffic
interface GigabitEthernet1/0/24
 description Uplink to EDGE-RTR
 no switchport
 ip address 10.0.2.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.0.2.1
 network 10.0.0.0 0.0.255.255 area 0
 default-information originate
!
line vty 0 4
 transport input ssh
 login local
end
