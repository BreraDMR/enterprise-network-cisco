! Floor 1 access layer.
! The original BOM puts two Cisco CBS110-8T-D switches per floor
! ("switch X.1" serving rooms 1-3, "switch X.2" serving rooms 4-6),
! each with only 8 ports. With up to 8 seats *per room* and 3 rooms
! per switch, that's not enough ports (see example-code/README.md,
! "Findings" -- this is one of them). This config models the access
! layer as appropriately-sized per floor instead of literally as two
! 8-port switches, so the VLAN/port-security pattern below is still
! correct to copy onto real, adequately-sized hardware.
!
hostname ACC-SW-F1
!
service password-encryption
no ip domain-lookup
enable secret REPLACE_ME
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
vlan 101
 name F1-ROOM1
vlan 102
 name F1-ROOM2
vlan 103
 name F1-ROOM3
vlan 104
 name F1-ROOM4
vlan 105
 name F1-ROOM5
vlan 106
 name F1-ROOM6
!
interface range GigabitEthernet0/1-6
 description Floor 1 Room 1 workstations (6 seats)
 switchport mode access
 switchport access vlan 101
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/7-14
 description Floor 1 Room 2 workstations (8 seats)
 switchport mode access
 switchport access vlan 102
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/15-21
 description Floor 1 Room 3 workstations (7 seats)
 switchport mode access
 switchport access vlan 103
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/22-26
 description Floor 1 Room 4 workstations (5 seats)
 switchport mode access
 switchport access vlan 104
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/27-32
 description Floor 1 Room 5 workstations (6 seats)
 switchport mode access
 switchport access vlan 105
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface range GigabitEthernet0/33-37
 description Floor 1 Room 6 workstations (5 seats)
 switchport mode access
 switchport access vlan 106
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/38
 description Uplink trunk to CORE-SW1
 switchport mode trunk
 switchport trunk allowed vlan 101,102,103,104,105,106,1
 switchport trunk native vlan 1
!
interface Vlan1
 ip address 10.0.0.11 255.255.255.240
 no shutdown
ip default-gateway 10.0.0.1
!
line vty 0 4
 transport input ssh
 login local
end
